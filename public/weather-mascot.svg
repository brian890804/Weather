<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景圓角方形漸層 (深邃科技星空藍) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 太陽暖金亮眼漸層 -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFAE19" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- 太陽光芒漸層 -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD33" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- 雲朵柔和立體漸層 -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#DCE6F2" />
    </linearGradient>

    <!-- 小雨滴青翠霓虹水藍漸層 -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 太陽背後暖暖光暈 -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 雲朵立體軟陰影 -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. 圓角基底圖標背景 (App Icon 風格，適合作為 PWA 與網頁 Favicon) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- 2. 可愛活潑小太陽 (右上角) -->
  <g transform="translate(325, 175)">
    <!-- 太陽光芒 (8 道圓角放射光束) -->
    <g stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-92" x2="0" y2="-112" />
      <line x1="65" y1="-65" x2="79" y2="-79" />
      <line x1="92" y1="0" x2="112" y2="0" />
      <line x1="65" y1="65" x2="79" y2="79" />
      <line x1="0" y1="92" x2="0" y2="112" />
      <line x1="-65" y1="65" x2="-79" y2="79" />
      <line x1="-92" y1="0" x2="-112" y2="0" />
      <line x1="-65" y1="-65" x2="-79" y2="-79" />
    </g>

    <!-- 太陽本體 -->
    <circle r="72" fill="url(#sunGrad)" filter="url(#sunGlow)" />

    <!-- 太陽可愛俏皮眨眼與微笑表情 -->
    <!-- 左眼（彎彎開心的笑瞇眼） -->
    <path d="M -36 -6 Q -24 -20 -12 -6" fill="none" stroke="#7C2D12" stroke-width="7" stroke-linecap="round" />
    <!-- 右眼（圓圓亮晶晶大眼睛） -->
    <ellipse cx="24" cy="-8" rx="8" ry="11" fill="#7C2D12" />
    <circle cx="21" cy="-12" r="3.5" fill="#FFFFFF" />
    <!-- 腮紅 -->
    <ellipse cx="-34" cy="12" rx="10" ry="6" fill="#EA580C" opacity="0.45" />
    <ellipse cx="34" cy="12" rx="10" ry="6" fill="#EA580C" opacity="0.45" />
    <!-- 開心燦爛小嘴巴 -->
    <path d="M -12 10 Q 6 28 22 10" fill="none" stroke="#7C2D12" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 3. 前方立體萌系胖嘟嘟白雲 (主體中心) -->
  <g filter="url(#cloudShadow)">
    <!-- 雲朵泡泡輪廓路徑 -->
    <path d="
      M 160 365
      L 355 365
      A 55 55 0 0 0 395 272
      A 72 72 0 0 0 310 192
      A 92 92 0 0 0 178 222
      A 68 68 0 0 0 108 300
      A 65 65 0 0 0 160 365
      Z
    " fill="url(#cloudGrad)" />

    <!-- 雲朵底部環境高光反光 (增添水晶卡通質感) -->
    <path d="
      M 160 362
      L 355 362
      A 52 52 0 0 0 390 280
      C 370 335 320 355 240 355
      C 180 355 130 340 115 315
      A 62 62 0 0 0 160 362
      Z
    " fill="#CBD5E1" opacity="0.55" />

    <!-- 4. 雲朵超可愛呆萌表情 (Kawaii Face) -->
    <!-- 左大眼 -->
    <ellipse cx="210" cy="285" rx="12" ry="16" fill="#1E293B" />
    <circle cx="206" cy="278" r="5" fill="#FFFFFF" />
    <circle cx="214" cy="292" r="2.5" fill="#FFFFFF" />

    <!-- 右大眼 -->
    <ellipse cx="295" cy="285" rx="12" ry="16" fill="#1E293B" />
    <circle cx="291" cy="278" r="5" fill="#FFFFFF" />
    <circle cx="299" cy="292" r="2.5" fill="#FFFFFF" />

    <!-- 粉嫩草莓腮紅 -->
    <ellipse cx="180" cy="302" rx="15" ry="9" fill="#FB7185" opacity="0.65" />
    <ellipse cx="325" cy="302" rx="15" ry="9" fill="#FB7185" opacity="0.65" />

    <!-- 軟萌開朗微笑波浪嘴 -->
    <path d="M 242 292 Q 252 308 263 292" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 5. 雲朵下方跳躍的可愛水晶小雨滴 -->
  <g transform="translate(195, 415)">
    <path d="M 0 -18 C -12 2 -12 16 0 16 C 12 16 12 2 0 -18 Z" fill="url(#dropGrad)" />
    <!-- 雨滴高光 -->
    <ellipse cx="-3" cy="6" rx="2.5" ry="5" fill="#BAE6FD" opacity="0.75" />
  </g>

  <g transform="translate(265, 435)">
    <path d="M 0 -16 C -10 2 -10 14 0 14 C 10 14 10 2 0 -16 Z" fill="url(#dropGrad)" />
    <!-- 雨滴高光 -->
    <ellipse cx="-2.5" cy="5" rx="2" ry="4" fill="#BAE6FD" opacity="0.75" />
  </g>

  <g transform="translate(330, 410)">
    <path d="M 0 -18 C -12 2 -12 16 0 16 C 12 16 12 2 0 -18 Z" fill="url(#dropGrad)" />
    <!-- 雨滴高光 -->
    <ellipse cx="-3" cy="6" rx="2.5" ry="5" fill="#BAE6FD" opacity="0.75" />
  </g>

  <!-- 6. 點綴小星光 (閃耀晴空) -->
  <path d="M 125 160 Q 135 160 135 150 Q 135 160 145 160 Q 135 160 135 170 Q 135 160 125 160 Z" fill="#FDE047" opacity="0.85" />
  <path d="M 390 120 Q 396 120 396 114 Q 396 120 402 120 Q 396 120 396 126 Q 396 120 390 120 Z" fill="#FDE047" opacity="0.9" />
</svg>
